name: v0.3 reminder test builds

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest lunardate==0.3.0 qrcode==8.2

      - name: Run tests
        run: python -m pytest -q

      - name: Compile-check Python sources
        run: python -m compileall -q main.py birthday_core.py storage.py lan_sync.py reminder_engine.py notification_backends.py

  windows:
    name: Build windows
    needs: tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Flet Windows app
        id: flet-build
        uses: flet-dev/flet-build-action@v1
        with:
          target: windows
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-number: ${{ github.run_number }}

      - name: Upload Windows test build
        uses: actions/upload-artifact@v7
        with:
          name: family-birthday-windows-v0.3-test-${{ github.run_number }}
          path: ${{ steps.flet-build.outputs.archive-path }}
          archive: false
          if-no-files-found: error

  android:
    name: Build patched Android APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Android notification patcher
        run: python -m pip install --upgrade pip "flet[all]==1.0.0" "flet-android-notifications==0.11.2"

      - name: Generate Android project
        id: first-build
        continue-on-error: true
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-number: ${{ github.run_number }}

      - name: Verify generated Flutter project
        shell: bash
        run: |
          test -d build/flutter
          test -f build/flutter/pubspec.yaml

      - name: Patch notification receivers and desugaring
        run: flet-android-notifications-patch --project-root build/flutter

      - name: Rebuild patched APK
        shell: bash
        run: |
          FLUTTER_BIN="$(find "$HOME/flutter" -type f -path "*/bin/flutter" -print -quit)"
          test -n "$FLUTTER_BIN"
          echo "Using Flutter: $FLUTTER_BIN"
          cd build/flutter
          "$FLUTTER_BIN" build apk --release
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Package APK
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          apk = Path("build/flutter/build/app/outputs/flutter-apk/app-release.apk")
          out = Path("family-birthday-manager-v0.3-test-android-apk.zip")
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as z:
              z.write(apk, arcname="family_birthday_manager.apk")
          print(out)
          PY

      - name: Upload Android test build
        uses: actions/upload-artifact@v7
        with:
          name: family-birthday-android-v0.3-test-${{ github.run_number }}
          path: family-birthday-manager-v0.3-test-android-apk.zip
          archive: false
          if-no-files-found: error
