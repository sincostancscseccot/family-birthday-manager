name: v0.2 test builds

on:
  push:
    branches:
      - v0.2.0-dev
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python core tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest lunardate==0.3.0 qrcode==8.2

      - name: Run tests
        run: python -m pytest -q

      - name: Compile-check Python sources
        run: python -m compileall -q main.py birthday_core.py storage.py lan_sync.py

  build:
    name: Build ${{ matrix.target }}
    needs: tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            runner: windows-latest
          - target: apk
            runner: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Flet app
        id: flet-build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.target }}
          runner-python-version: "3.13"
          bundled-python-version: "3.13"
          build-number: ${{ github.run_number }}

      - name: Upload test build
        uses: actions/upload-artifact@v7
        with:
          name: family-birthday-${{ matrix.target }}-v0.2-test-${{ github.run_number }}
          path: ${{ steps.flet-build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
          overwrite: false
