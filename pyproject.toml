[project]
name = "family_birthday_manager"
version = "0.3.0"
description = "Offline family birthday manager for Windows and Android with Gregorian/Lunar support"
requires-python = ">=3.11,<3.15"
dependencies = [
  "flet==1.0.0",
  "lunardate==0.3.0",
  "qrcode==8.2",
  "flet-android-notifications==0.11.2",
  "Windows-Toasts==1.3.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "flet[all]==1.0.0",
]

[tool.flet]
product = "家庭生日管理器"
org = "com.local"
bundle_id = "com.local.familybirthday"
build_number = 3

[tool.flet.app]
module = "main.py"


[tool.flet.android.manifest_application]
usesCleartextTraffic = "true"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.POST_NOTIFICATIONS" = true
"android.permission.RECEIVE_BOOT_COMPLETED" = true
