[project]
name = "family_birthday_manager"
version = "0.1.0"
description = "Offline family birthday manager for Windows and Android with Gregorian/Lunar support"
requires-python = ">=3.10,<3.15"
dependencies = [
  "flet[all]==1.0.0",
  "lunardate==0.3.0",
]

[tool.flet]
product = "家庭生日管理器"
org = "com.local"
bundle_id = "com.local.familybirthday"
build_number = 1

[tool.flet.app]
module = "main.py"
